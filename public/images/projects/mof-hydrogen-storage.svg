<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title">
  <title id="title">Machine learning estimates usable hydrogen capacity by mass and volume</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#163343" />
      <stop offset="1" stop-color="#0d1b29" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#a5d5d8" stroke-opacity=".08" />
    </pattern>
    <g id="pore">
      <path d="M0-64 55-32v64L0 64l-55-32v-64Z" fill="#173849" stroke="#62c7c1" stroke-width="3" stroke-linejoin="round" />
      <g fill="#78d9d1">
        <circle cy="-64" r="5" />
        <circle cx="55" cy="-32" r="5" />
        <circle cx="55" cy="32" r="5" />
        <circle cy="64" r="5" />
        <circle cx="-55" cy="32" r="5" />
        <circle cx="-55" cy="-32" r="5" />
      </g>
    </g>
    <g id="hydrogen">
      <path d="M-8 0H8" stroke="#ffe1a0" stroke-width="5" />
      <circle cx="-8" r="6" fill="#ffe1a0" />
      <circle cx="8" r="6" fill="#ffe1a0" />
    </g>
  </defs>
  <path d="M0 0h960v540H0z" fill="url(#background)" />
  <path d="M0 0h960v540H0z" fill="url(#grid)" />
  <g font-family="system-ui, sans-serif">
    <rect x="46" y="56" width="334" height="428" rx="26" fill="#102433" stroke="#315567" />
    <text x="213" y="120" fill="#f2f8fa" font-size="34" font-weight="700" text-anchor="middle">Porous material</text>
    <use href="#pore" x="213" y="221" />
    <use href="#pore" x="158" y="317" />
    <use href="#pore" x="268" y="317" />
    <use href="#hydrogen" transform="translate(213 221) rotate(-28)" />
    <use href="#hydrogen" transform="translate(158 317) rotate(25)" />
    <use href="#hydrogen" transform="translate(268 317) rotate(-18)" />
    <use href="#hydrogen" x="110" y="437" />
    <text x="136" y="447" fill="#ffe1a0" font-size="29" font-weight="650">Hydrogen (H₂)</text>

    <text x="470" y="237" fill="#9ed9da" font-size="28" font-weight="650" text-anchor="middle">
      <tspan x="470">Machine</tspan>
      <tspan x="470" dy="33">learning</tspan>
    </text>
    <path d="M413 308h115m-14-13 14 13-14 13" fill="none" stroke="#78d9d1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="570" y="142" fill="#9ed9da" font-size="25" font-weight="700" letter-spacing="2">ESTIMATED</text>
    <text x="570" y="201" fill="#f2f8fa" font-size="42" font-weight="750">
      <tspan x="570">Hydrogen</tspan>
      <tspan x="570" dy="47">capacity</tspan>
    </text>
    <g fill="#1a394a" stroke="#436679">
      <rect x="570" y="284" width="344" height="64" rx="15" />
      <rect x="570" y="365" width="344" height="64" rx="15" />
    </g>
    <g font-size="30" font-weight="650">
      <text x="594" y="326" fill="#f2f8fa">By mass</text>
      <text x="890" y="326" fill="#92ddd8" text-anchor="end">wt%</text>
      <text x="594" y="407" fill="#f2f8fa">By volume</text>
      <text x="890" y="407" fill="#92ddd8" text-anchor="end">g H₂/L</text>
    </g>
  </g>
</svg>
